<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 - 微博热度监测系统</title>
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>

  <link rel="stylesheet" href="css/login.css">
</head>
<body>

<div id="app" class="login-container">
  <div class="header">
    <h1>{{ title }}</h1>
    <p>{{ subtitle }}</p>
  </div>

  <div v-if="msg.content" :class="['message', msg.type]">
    {{ msg.content }}
  </div>

  <div class="form-group">
    <template v-if="view === 'login'">
      <label>账号</label>
      <input v-model="form.account" type="text" placeholder="用户名/手机号/邮箱">
      <label style="margin-top: 15px;">密码</label>
      <input v-model="form.password" type="password" placeholder="请输入密码" @keyup.enter="handleSubmit">
    </template>

    <template v-if="view === 'reg'">
      <label>用户名</label>
      <input v-model="form.username" type="text" placeholder="设置您的登录用户名">

      <label style="margin-top: 15px;">手机号</label>
      <input v-model="form.phone" type="text" placeholder="您的手机号码">

      <label style="margin-top: 15px;">电子邮箱</label>
      <input v-model="form.email" type="email" placeholder="example@mail.com">

      <label style="margin-top: 15px;">设置密码</label>
      <input v-model="form.password" type="password" placeholder="请输入密码">
    </template>

    <template v-if="view === 'forget'">
      <label>用户名</label>
      <input v-model="form.username" type="text" placeholder="请输入原用户名">

      <label style="margin-top: 15px;">绑定联系方式</label>
      <input v-model="form.account" type="text" placeholder="注册时的手机号或邮箱">

      <label style="margin-top: 15px;">设置新密码</label>
      <input v-model="form.password" type="password" placeholder="请输入新密码">
    </template>
  </div>

  <button class="btn-submit" @click="handleSubmit">
    {{ submitText }}
  </button>

  <div class="footer-links">
    <template v-if="view === 'login'">
      <a @click="switchView('reg')">注册新账号</a>
      <a @click="switchView('forget')">忘记密码？</a>
    </template>
    <template v-else>
      <a @click="switchView('login')">返回登录</a>
    </template>
  </div>
</div>

<script src="js/login.js"></script>

</body>
</html>
