<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>舆情沙盘模拟室</title>
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/simulation.css">
    <!-- 第三方库 -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.4/dist/purify.min.js"></script>
</head>
<body>
<div id="app" class="container">

    <div class="nav-actions" style="justify-content: flex-start; margin-bottom: 20px;">
        <a href="portal.html" class="nav-btn btn-back">🏠 返回功能中枢</a>
    </div>

    <h1>🎲 舆情沙盘模拟室</h1>
    <div class="input-area">
        <textarea v-model="eventDesc" rows="4" placeholder="输入模拟事件，例如：某顶流明星被曝隐婚生子..."></textarea>
        <button class="btn btn-primary" @click="startSimulation" :disabled="loading">{{ loading ? '沙盘推演中...' : '启动多模型推演' }}</button>
    </div>

    <div v-if="sessionId">
        <div class="section-header" style="display: flex; align-items: center; gap: 10px; margin: 20px 0;">
            <h2 style="margin:0;">📊 多维度推演</h2>
            <small v-if="loading" style="color: #64748b;">AI 正在模拟各方博弈中...</small>
        </div>

        <div class="models-grid">
            <div v-for="(output, model) in predictions" :key="model" class="model-card">
                <div class="model-name">
                    <span class="icon">🤖</span> {{ model }}
                    <span v-if="output" class="badge badge-done">● 推演完成</span>
                    <span v-else class="badge badge-waiting">● 思考中...</span>
                </div>

                <div v-if="!output" class="model-output">
                    <div class="skeleton skeleton-title"></div>
                    <div class="skeleton skeleton-text" style="width: 90%"></div>
                    <div class="skeleton skeleton-text" style="width: 95%"></div>
                    <div class="skeleton skeleton-text" style="width: 70%"></div>
                </div>

                <div v-else class="model-output active" v-html="renderMarkdown(output)"></div>
            </div>
        </div>

        <div v-if="loading && !verdict" class="verdict-card is-thinking" style="opacity: 0.7;">
            <h3>⚖️ 正在汇总专家意见...</h3>
            <p>首席裁决官正在进行深度逻辑推演与风险定价...</p>
        </div>

        <div v-if="verdict" class="verdict-card">
            <h2 style="margin-top:0; border-bottom: 1px solid rgba(255,255,255,0.2); padding-bottom: 10px;">⚖️ 终审决策</h2>
            <div class="verdict-content" v-html="renderMarkdown(verdict)"></div>

            <div class="verdict-footer" style="margin-top:20px; padding-top:15px; border-top: 1px dashed rgba(255,255,255,0.3);">
                <span>系统风险定级：</span>
                <span class="risk-tag" :class="{
                'risk-high': riskLevel === 'HIGH',
                'risk-medium': riskLevel === 'MEDIUM',
                'risk-low': riskLevel === 'LOW'
            }">{{ riskLevel || '评估中' }}</span>
            </div>
        </div>
    </div>

    <div class="history-panel" v-if="showHistory">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <h3>📋 历史模拟</h3>
            <button @click="clearAllHistory" style="background:none; border:none; cursor:pointer;" title="清空全部历史">🗑️</button>
        </div>
        <div v-for="h in history" :key="h.id" style="margin-bottom:15px; padding:10px; background:#f1f5f9; border-radius:8px;">
            <div style="display: flex; justify-content: space-between;">
                <div style="flex:1; cursor:pointer;" @click="viewHistory(h.id)">
                    <div style="font-weight:bold;">{{ h.eventDescription.substring(0,30) }}...</div>
                    <div style="font-size:12px; color:#64748b;">{{ h.createTime }}</div>
                </div>
                <button @click.stop="deleteHistory(h.id)" style="background:none; border:none; color:#999;">✕</button>
            </div>
        </div>
    </div>
    <button style="position:fixed; right:20px; bottom:20px;" class="btn" @click="showHistory=!showHistory">📜 历史</button>
</div>
<script src="js/simulation.js"></script>
</body>
</html>
