<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>功能控制台 - 微博数据系统</title>
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>

  <link rel="stylesheet" href="css/portal.css">
</head>
<body>

<div id="app" class="portal-container">
  <div class="welcome-section">
    <h1>您好，{{ username }}</h1>
    <p>请选择您要使用的功能模块</p>
  </div>

  <div class="menu-grid">
    <div class="menu-card" @click="goTo('index.html')">
      <span class="icon">🔥</span>
      <h3>热搜监测看板</h3>
      <p>实时监控微博名人热度与排名</p>
    </div>

    <div class="menu-card" @click="goTo('analysis.html')">
      <span class="icon">📈</span>
      <h3>博文风向分析</h3>
      <p>指定微博 ID，一键分析评论情感趋向</p>
    </div>

    <!-- 在 portal.html 的 menu-grid 中添加 -->
    <div class="menu-card" @click="goTo('simulation.html')">
      <span class="icon">🎲</span>
      <h3>舆情沙盘模拟室</h3>
      <p>多模型博弈 · DeepSeek 终审</p>
    </div>

    <div class="menu-card" @click="goTo('trace.html')">
      <span class="icon">🦋</span>
      <h3>蝴蝶效应·传播溯源</h3>
      <p>抓取转发链，AI定位引爆点</p>
    </div>

    <div class="menu-card" style="opacity: 0.6; cursor: not-allowed;">
      <span class="icon">⚙️</span>
      <h3>个人中心</h3>
      <p>修改资料与安全设置</p>
    </div>
  </div>

  <button class="logout-btn" @click="logout">退出登录</button>
</div>

<script src="js/portal.js"></script>
</body>
</html>
