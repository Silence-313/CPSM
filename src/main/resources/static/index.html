<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>微博名人热度监测系统 - 颗粒度版</title>
  <!-- 外部样式表 -->
  <link rel="stylesheet" href="css/index.css">
  <!-- Vue 3 核心库 -->
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
</head>
<body>
<div id="app">
  <div class="container">
    <h1>🔥 微博实时热度监测 <small style="font-size: 0.5em; color: #999;">(颗粒度增强版)</small></h1>

    <div class="nav-actions">
      <a href="portal.html" class="nav-btn btn-back">🏠 返回功能中枢</a>
    </div>

    <div class="monitor-manager">
      <div class="manager-header">
        <h3 class="manager-title">📊 重点监测看板</h3>
        <div class="add-star-group">
          <input v-model="newStar" @keyup.enter="addStar" placeholder="输入名人姓名" class="star-input">
          <button @click="addStar" class="add-star-btn">+ 快速添加</button>
        </div>
      </div>

      <table class="monitor-table">
        <thead>
        <tr>
          <th width="150">名人姓名</th>
          <th>颗粒度关键词组</th>
          <th width="120">显示颜色</th>
          <th width="100">总命中数</th>
          <th width="120">当前热度</th>
          <th style="text-align: center;" width="80">操作</th>
        </tr>
        </thead>
        <tbody>
        <tr v-for="star in monitorStars" :key="star.id">
          <td style="font-weight: bold;">{{ star.name }}</td>
          <td>
            <div class="keywords-container">
                <span v-for="kw in star.keywords" :key="kw" class="kw-tag">
                  {{ kw }}
                  <span @click="deleteKeyword(star.id, kw)" class="kw-delete">&times;</span>
                </span>
              <input class="kw-quick-input" placeholder="+ 关键词" @keyup.enter="handleKeywordEnter(star.id, $event)">
            </div>
          </td>
          <td>
            <div class="color-picker">
                <span v-for="c in colorPresets" :key="c.value" class="color-dot"
                      :class="{ active: star.color === c.value }" :style="{ backgroundColor: c.value }"
                      @click="updateStarColor(star, c.value)"></span>
            </div>
          </td>
          <td>
              <span class="hit-badge" :class="{ 'has-hits': star.onBoardCount > 0 }">
                {{ star.onBoardCount }} 条
              </span>
          </td>
          <td>
              <span :style="{ color: star.totalHot > 0 ? star.color : '#999', fontWeight: 'bold' }">
                {{ formatNum(star.totalHot) }}
              </span>
          </td>
          <td style="text-align: center;">
            <button @click="removeStar(star.name)" class="remove-star-btn">移除</button>
          </td>
        </tr>
        <tr v-if="monitorStars.length === 0">
          <td colspan="6" style="text-align: center; color: #999; padding: 20px;">暂无监测对象</td>
        </tr>
        </tbody>
      </table>
    </div>

    <div class="control-bar">
      <button class="refresh-btn" @click="fetchData" :disabled="loading">{{ loading ? '同步中...' : '立即刷新数据' }}</button>
      <label class="auto-refresh-label"><input type="checkbox" v-model="autoRefresh" @change="toggleAutoRefresh"> 自动刷新 (60s)</label>
    </div>

    <ul class="hot-list">
      <li v-for="(item, index) in hotSearchList" :key="index" class="hot-item" :style="getHighlightStyle(item.word)">
        <div class="rank">{{ index + 1 }}</div>
        <div class="content">
          {{ item.word }}
          <span v-if="isMatched(item.word)" class="match-badge" :style="{ backgroundColor: getMatchedColor(item.word) }">
            命中: {{ getMatchedValue(item.word) }}
          </span>
        </div>
        <div class="num">{{ formatNum(item.num) }} 热度</div>
      </li>
    </ul>
  </div>
</div>

<!-- 外部 JavaScript 文件 -->
<script src="js/index.js"></script>
</body>
</html>
