# ============================================================
# CPMS 配置文件
# 请将所有 "your-xxx" 占位符替换为你自己的真实密钥
# 详细说明见 README.md
# ============================================================

spring.application.name=demo

# ====== MySQL ======
spring.datasource.url=jdbc:mysql://localhost:3306/cpms?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai
spring.datasource.username=root
spring.datasource.password=your-mysql-password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

server.port=8080
server.address=0.0.0.0

# ====== MyBatis ======
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.configuration.map-underscore-to-camel-case=true

# ====== Flyway ======
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# ====== Elasticsearch ======
elasticsearch.host=localhost
elasticsearch.port=9200
elasticsearch.scheme=http
elasticsearch.analyzer=ik_max_word

# ====== Spring AI (dummy, not used) ======
spring.ai.openai.api-key=dummy-key

# ====== LLM API Keys ======
qwen.api-key=your-qwen-api-key
qwen.base-url=https://dashscope.aliyuncs.com/compatible-mode/v1
qwen.model=qwen-turbo

deepseek.api-key=your-deepseek-api-key
deepseek.base-url=https://api.deepseek.com/v1
deepseek.model=deepseek-chat

siliconflow.api-key=your-siliconflow-api-key
siliconflow.base-url=https://api.siliconflow.cn/v1
siliconflow.model=deepseek-ai/DeepSeek-V3

hunyuan.api-key=your-hunyuan-api-key
hunyuan.base-url=https://api.hunyuan.cloud.tencent.com/v1
hunyuan.model=hunyuan-turbo

doubao.api-key=your-doubao-api-key
doubao.base-url=https://ark.cn-beijing.volces.com/api/v3
doubao.model=ep-20260411210904-qvcnk

kimi.api-key=your-kimi-api-key
kimi.base-url=https://api.moonshot.cn/v1
kimi.model=kimi-k2.5

# ====== Simulation Models (6 LLMs) ======
simulation.models[0].name=Qwen
simulation.models[0].url=https://dashscope.aliyuncs.com/compatible-mode/v1
simulation.models[0].api-key=your-qwen-api-key
simulation.models[0].model=qwen-turbo

simulation.models[1].name=DeepSeek
simulation.models[1].url=https://api.deepseek.com/v1
simulation.models[1].api-key=your-deepseek-api-key
simulation.models[1].model=deepseek-chat

simulation.models[2].name=SiliconFlow
simulation.models[2].url=https://api.siliconflow.cn/v1
simulation.models[2].api-key=your-siliconflow-api-key
simulation.models[2].model=deepseek-ai/DeepSeek-V3

simulation.models[3].name=DouBao
simulation.models[3].url=https://ark.cn-beijing.volces.com/api/v3
simulation.models[3].api-key=your-doubao-api-key
simulation.models[3].model=ep-20260411210904-qvcnk

simulation.models[4].name=HunYuan
simulation.models[4].url=https://api.hunyuan.cloud.tencent.com/v1
simulation.models[4].api-key=your-hunyuan-api-key
simulation.models[4].model=hunyuan-turbo

simulation.models[5].name=Kimi
simulation.models[5].url=https://api.moonshot.cn/v1
simulation.models[5].api-key=your-kimi-api-key
simulation.models[5].model=kimi-k2.5

# ====== Simulation Judge (DeepSeek) ======
simulation.judge.name=DeepSeek-R1
simulation.judge.url=https://api.deepseek.com
simulation.judge.api-key=your-deepseek-api-key
simulation.judge.model=deepseek-chat

# ====== Neo4j ======
spring.neo4j.uri=bolt://localhost:7687
spring.neo4j.authentication.username=neo4j
spring.neo4j.authentication.password=your-neo4j-password

# ====== Python Spider Interpreter ======
weibo.python.path=/opt/anaconda3/envs/weibo_spider/bin/python

# ====== Infrastructure Auto-start ======
infra.script.path=./start-infra.sh

# ====== Weibo Open Platform ======
weibo.open.app-key=your-weibo-app-key
weibo.open.app-secret=your-weibo-app-secret
weibo.open.access-token=your-weibo-access-token

# ====== Actuator ======
management.endpoints.web.exposure.include=health,metrics,info,env
management.endpoints.web.base-path=/actuator
management.endpoint.health.show-details=always
management.endpoint.health.show-components=always
management.metrics.export.prometheus.enabled=true
management.metrics.tags.application=${spring.application.name}
